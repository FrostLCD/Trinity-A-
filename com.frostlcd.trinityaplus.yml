app-id: com.frostlcd.TrinityAPlus
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: trinity
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  # The launcher invokes this binary when importing APKs. Build it inside the
  # sandbox so extraction does not depend on a host installation.
  - name: mcpelauncher-extract
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-extract.git
        branch: ng
  - name: trinity-a-plus
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDISABLE_X86_64_WARNING=ON
    sources:
      - type: dir
        path: .
