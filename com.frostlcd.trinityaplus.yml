app-id: com.frostlcd.TrinityAPlus
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: trinity
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: trinity-a-plus
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDISABLE_X86_64_WARNING=ON
    sources:
      - type: dir
        path: .
